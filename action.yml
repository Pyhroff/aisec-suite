name: aisec-suite
description: Scan a repo with mcpaudit, memsentry and ragsentry and upload SARIF to GitHub code scanning.
inputs:
  path:
    description: Repository path to scan
    default: "."
  fail-on:
    description: Fail the job at or above this severity (low|medium|high|critical). Empty = never fail.
    default: ""
  rag-dir:
    description: Optional directory of RAG source documents (ragsentry)
    default: ""
  install:
    description: Command that installs the scanners (mcpaudit, memsentry, ragsentry). Required until they are published to a package index.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install aisec-suite and scanners
      shell: bash
      run: |
        pip install "${{ github.action_path }}"
        if [ -n "${{ inputs.install }}" ]; then ${{ inputs.install }}; fi
    - name: Scan
      shell: bash
      run: |
        args=(scan "${{ inputs.path }}" --sarif aisec.sarif)
        if [ -n "${{ inputs.fail-on }}" ]; then args+=(--fail-on "${{ inputs.fail-on }}"); fi
        if [ -n "${{ inputs.rag-dir }}" ]; then args+=(--rag "${{ inputs.rag-dir }}"); fi
        aisec "${args[@]}"
    - name: Upload SARIF
      if: always() && hashFiles('aisec.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: aisec.sarif
