name: security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  unified-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the core scanner suite
        run: pip install -e ".[core]"

      - name: Validate repository security policy
        run: aisec policy validate examples/security-policy.json

      - name: Run unified AI security scan
        run: |
          aisec scan . --all --policy examples/security-policy.json --sarif aisec.sarif --json aisec.json

      - name: Upload SARIF
        if: ${{ always() && hashFiles('aisec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: aisec.sarif
