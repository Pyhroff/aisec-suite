name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Adapter tests use in-memory fake scanners, so they run here even though the real ones are not on PyPI.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
