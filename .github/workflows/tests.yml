name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Adapter tests use in-memory fake scanners, so they run here even though the real ones are not on PyPI.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term-missing

  integration:
    # Installs the published scanners so tests/test_cli.py exercises real mcpaudit and memsentry
    # instead of skipping. Research-preview tests still skip: those packages are not on PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[core,dev]"
      - run: pytest -q -rs --cov --cov-report=term-missing

  # Single check name for branch protection: mark "tests-gate" as required in repository settings so neither the
  # unit matrix nor the real-scanner integration job can be skipped or fail silently.
  tests-gate:
    if: always()
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = "success" && test "${{ needs.integration.result }}" = "success"
