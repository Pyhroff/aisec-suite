name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Scanner-dependent tests skip themselves when mcpaudit/memsentry are not installed.
      - run: pip install -e ".[dev]" && pytest -q
