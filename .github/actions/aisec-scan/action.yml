name: "aisec unified scan"
description: "Run aisec-suite against a repository and optionally publish SARIF results."
author: "Pyhroff"
inputs:
  path:
    description: "Repository path to scan."
    required: false
    default: "."
  fail-on:
    description: "Fail when findings reach this severity: low, medium, high, or critical."
    required: false
    default: "high"
  sarif:
    description: "SARIF output path. Leave empty to skip SARIF generation."
    required: false
    default: "aisec.sarif"
  json:
    description: "Normalized JSON output path. Leave empty to skip JSON generation."
    required: false
    default: ""
  install-extra:
    description: "Optional dependency set to install from aisec-suite."
    required: false
    default: "core"
  policy-profile:
    description: "Built-in policy profile: strict, balanced, or dev."
    required: false
    default: ""
outputs:
  findings:
    description: "Number of findings emitted by the scan."
    value: ${{ steps.scan.outputs.findings }}
runs:
  using: "composite"
  steps:
    - name: Install aisec-suite
      shell: bash
      env:
        AISEC_INSTALL_EXTRA: ${{ inputs.install-extra }}
        AISEC_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$AISEC_INSTALL_EXTRA" ]; then
          if [[ ! "$AISEC_INSTALL_EXTRA" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid install-extra: only letters, numbers, '.', '_' and '-' are allowed." >&2
            exit 2
          fi
          python -m pip install -e "$AISEC_ACTION_PATH[$AISEC_INSTALL_EXTRA]"
        else
          python -m pip install -e "$AISEC_ACTION_PATH"
        fi

    - name: Run unified scan
      id: scan
      shell: bash
      env:
        AISEC_PATH: ${{ inputs.path }}
        AISEC_FAIL_ON: ${{ inputs.fail-on }}
        AISEC_SARIF: ${{ inputs.sarif }}
        AISEC_JSON: ${{ inputs.json }}
        AISEC_POLICY_PROFILE: ${{ inputs.policy-profile }}
      run: |
        set +e
        args=(scan "$AISEC_PATH" --all --fail-on "$AISEC_FAIL_ON")
        if [ -n "$AISEC_POLICY_PROFILE" ]; then args+=(--policy-profile "$AISEC_POLICY_PROFILE"); fi
        if [ -n "$AISEC_SARIF" ]; then args+=(--sarif "$AISEC_SARIF"); fi
        if [ -n "$AISEC_JSON" ]; then args+=(--json "$AISEC_JSON"); fi
        aisec "${args[@]}"
        code=$?
        echo "findings=$(python - <<'PY'
        import json, os
        path = os.environ.get("AISEC_JSON", "")
        if path and os.path.isfile(path):
            try:
                print(len(json.load(open(path, encoding="utf-8"))))
            except Exception:
                print("")
        else:
            print("")
        PY
        )" >> "$GITHUB_OUTPUT"
        exit "$code"
