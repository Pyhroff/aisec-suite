[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisec-suite"
version = "1.1.0"
description = "Unified AI security toolkit for MCP, memory, RAG, training-data, supply-chain, behavioral and package-worm risk."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pyhroff" }]
requires-python = ">=3.10"
keywords = ["AI security", "MCP", "LLM agents", "prompt injection", "RAG", "training data poisoning", "supply chain", "SARIF"]
classifiers = ["Development Status :: 4 - Beta","Intended Audience :: Developers","License :: OSI Approved :: MIT License","Programming Language :: Python :: 3","Programming Language :: Python :: 3.10","Programming Language :: Python :: 3.11","Programming Language :: Python :: 3.12","Topic :: Security"]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
core = ["pyhroff-mcpaudit>=0.7","memsentry>=1.2","pyhroff-ragsentry>=1.1"]
all = ["pyhroff-mcpaudit>=0.7","memsentry>=1.2","pyhroff-ragsentry>=1.1"]
future = ["adversagen>=0.1"]
dev = ["pytest>=8","ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Pyhroff/aisec-suite"
Issues = "https://github.com/Pyhroff/aisec-suite/issues"

[project.scripts]
aisec = "aisec.cli:app"
aisec-suite = "aisec.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisec*"]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E4","E7","E9","F"]
[tool.pytest.ini_options]
testpaths = ["tests"]
